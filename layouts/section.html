{{ define "main" }}
<main>
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  <ul class="posts">
    {{ range .Pages.ByDate.Reverse }}
    <li>
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    </li>
    {{ end }}
  </ul>
  <p class="back"><a href="{{ "/" | relURL }}">← {{ site.Params.author }}</a></p>
</main>
{{ end }}
