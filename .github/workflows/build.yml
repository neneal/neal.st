name: Build check

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.166.0
      HUGO_DEB_SHA256: eebe2ac57a402a0768096c57142334ffc857790cb159d1f68d609496e394d71c
    steps:
      - name: Install Hugo
        run: |
          set -euo pipefail
          deb="${{ runner.temp }}/hugo.deb"
          curl -fsSL -o "$deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.deb"
          echo "${HUGO_DEB_SHA256}  ${deb}" | sha256sum --check --strict -
          sudo dpkg -i "$deb"
          hugo version

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
        run: |
          set -euo pipefail
          export HUGO_PARAMS_LASTCOMMIT="$(git log -1 --format=%cI)"
          hugo --minify
